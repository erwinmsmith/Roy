[project]
name = "roy-cs-grpo-research"
version = "0.1.0"
description = "Counterfactual Structural GRPO research harness for Roy"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.1",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "scikit-learn>=1.4", "matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
roy-research = "roy_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roy_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
